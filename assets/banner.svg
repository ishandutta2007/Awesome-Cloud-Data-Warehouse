<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Grid Pattern (Background) -->
  <g opacity="0.15">
    <path d="M0 40H800 M0 80H800 M0 120H800 M0 160H800" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100 0V200 M200 0V200 M300 0V200 M400 0V200 M500 0V200 M600 0V200 M700 0V200" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Animated Floating Data Node Connections (Background Layer) -->
  <g opacity="0.25">
    <circle cx="150" cy="50" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="50;60;50" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="140" r="5" fill="#c084fc">
      <animate attributeName="cy" values="140;130;140" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="60" r="3" fill="#818cf8">
      <animate attributeName="cy" values="60;70;60" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M150 50 L250 120 L400 80 L550 150 L680 140" stroke="url(#glow-grad)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Text & Branding -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <!-- Title -->
    <text y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="url(#text-grad)" letter-spacing="1">
      Awesome Cloud Data Warehouse
    </text>
    <!-- Subtitle -->
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="0.5">
      Curated List of SaaS Platforms, Lakehouses, MPP Engines &amp; Open-Source OLAP Databases
    </text>
  </g>
</svg>
